[package]
name = "fsync"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.92"
blake3 = { version = "1.8.5", features = ["serde"] }
dirs = "6.0.0"
hex = "0.4.3"
hostname = "0.4.2"
ignore = "0.4.31"
mdns-sd = "0.20.2"
notify = "8.2.0"
parking_lot = "0.12.5"
quinn = "0.11.11"
rand = "0.10.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.8"
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
x509-parser = "0.18.1"
