[package]
name = "fsync"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.5"
dirs = "6.0.0"
hex = "0.4.3"
hostname = "0.4.2"
ignore = "0.4.31"
mdns-sd = "0.20.2"
notify = "8.2.0"
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.8"
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
x509-parser = "0.18.1"
